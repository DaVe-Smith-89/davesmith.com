
{% extends 'admin/master.html' %}

{% block body %}
    {% if current_user.is_authenticated %}
        <a href="{{ url_for('logout') }}" class="btn btn-primary btn-block">Logout</a>
    {% else %}
        <form class="card bg-light p-3" action="/am7jymb6" method="post">
            <div class="card-body">
                <div class="">
                    <label for="email">Enter Your Email</label>
                    <input type="email" class="form-control mb-2" name="email" id="email">
                    <label for="passwd">Enter your Password</label>
                    <input type="password" class="form-control" name="passwd" id="passwd">
                </div>
                <button type="submit" class="btn btn-primary my-2">Login</button>
            </div>
        </form>
    {% endif %}
{% endblock %}
